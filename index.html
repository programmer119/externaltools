<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>창업지원 공고 관리</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f6f8}iframe{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="tracker" src="./startup-support/" title="창업지원 공고 관리"></iframe><script>document.getElementById('tracker').addEventListener('load',function(){var w=this.contentWindow;try{w.sortRank=function(x){var d=w.dayDiff(x.deadline),deferred=(d!==null&&d<0)||!!w.saved[x.id],within=d===null?999999:Math.max(0,d);return(deferred?1000000:0)+within};w.visibleItems=function(){return w.categoryItems().filter(function(x){if(w.hidden[x.id])return false;var a=!!w.saved[x.id];return w.filter==='all'||(w.filter==='eligible'&&(x.eligibility==='eligible'||x.eligibility==='uncertain'))||(w.filter==='ineligible'&&x.eligibility==='ineligible')||(w.filter==='applied'&&a)}).sort(function(a,b){return w.sortRank(a)-w.sortRank(b)})};var note=w.document.querySelector('.note');if(note)note.textContent="지원가능에는 '확인 필요' 항목도 함께 표시합니다. 마감 지난 항목과 지원완료 항목은 뒤로 보냅니다.";w.draw()}catch(e){console.error(e)}});</script></body></html>
