name: Diagnose Pages
on:
  push:
    paths:
      - '.github/workflows/diagnose-pages.yml'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      SPACESHIP_API_KEY: ${{ secrets.SPACESHIP_API_KEY }}
      SPACESHIP_API_SECRET: ${{ secrets.SPACESHIP_API_SECRET }}
    steps:
      - name: DNS and HTTP checks
        shell: bash
        run: |
          echo '=== DNS github.io ==='
          getent hosts programmer119.github.io || true
          echo '=== DNS custom ==='
          getent hosts worklinks.suaveforge.com || true
          echo '=== GitHub Pages root ==='
          curl -sSIL --max-time 20 https://programmer119.github.io/worklinks/ | head -n 8 || true
          echo '=== GitHub Pages tracker ==='
          curl -sS -o /tmp/sub.b -w 'HTTP %{http_code}\n' --max-time 20 https://programmer119.github.io/worklinks/startup-support/ || true
          grep -o '<title>[^<]*</title>' /tmp/sub.b | head -1 || true
          echo '=== Spaceship secret availability ==='
          if [ -z "$SPACESHIP_API_KEY" ] || [ -z "$SPACESHIP_API_SECRET" ]; then
            echo 'SPACESHIP_SECRETS_MISSING=yes'
            exit 0
          fi
          echo 'SPACESHIP_SECRETS_MISSING=no'
          code=$(curl -sS --max-time 20 -o /tmp/dns.json -w '%{http_code}' \
            -H "X-API-Key: $SPACESHIP_API_KEY" \
            -H "X-API-Secret: $SPACESHIP_API_SECRET" \
            'https://spaceship.dev/api/v1/dns/records/suaveforge.com?take=200&skip=0' || true)
          echo "SPACESHIP_HTTP=$code"
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/dns.json')
          if not p.exists():
              print('SPACESHIP_BODY_MISSING=yes'); raise SystemExit
          try: data=json.loads(p.read_text())
          except Exception as e:
              print('SPACESHIP_JSON_OK=no'); print(p.read_text()[:300]); raise SystemExit
          print('SPACESHIP_JSON_OK=yes')
          found=[]
          def walk(x):
              if isinstance(x,dict):
                  n=str(x.get('name','')).rstrip('.')
                  if n in ('worklinks','worklinks.suaveforge.com'):
                      found.append({k:x.get(k) for k in ('type','name','value','ttl') if k in x})
                  for v in x.values(): walk(v)
              elif isinstance(x,list):
                  for v in x: walk(v)
          walk(data)
          print('WORKLINKS_RECORDS='+json.dumps(found,ensure_ascii=False,separators=(',',':')))
          PY
